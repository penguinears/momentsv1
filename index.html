<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moments</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    const uid = () => Math.random().toString(36).slice(2,9);

    // ---- Storage ----
    const USERS_KEY = "moments_users";
    const SESSION_KEY = "moments_session";
    const TIMELINES_KEY = "moments_timelines";
    const MESSAGES_KEY = "moments_messages";

    function readUsers(){ try{return JSON.parse(localStorage.getItem(USERS_KEY))||{}}catch{return{}} }
    function writeUsers(u){ localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
    async function createAccount(username,password){
      const users=readUsers();
      if(users[username]) throw new Error("username taken");
      users[username]={username,password,id:uid(),friends:[]};
      writeUsers(users);
    }
    async function signIn(username,password){
      const users=readUsers();
      if(!users[username]) throw new Error("no such user");
      if(users[username].password!==password) throw new Error("wrong password");
      localStorage.setItem(SESSION_KEY,JSON.stringify({username}));
      return users[username];
    }
    function signOut(){ localStorage.removeItem(SESSION_KEY); }
    function currentSession(){ try{return JSON.parse(localStorage.getItem(SESSION_KEY))}catch{return null;} }

    function readTimelines(){ try{return JSON.parse(localStorage.getItem(TIMELINES_KEY))||{}}catch{return{}} }
    function writeTimelines(t){ localStorage.setItem(TIMELINES_KEY,JSON.stringify(t)); }

    function addFriend(user,friend){
      const users=readUsers();
      if(!users[user].friends.includes(friend)){
        users[user].friends.push(friend);
        writeUsers(users);
      }
    }
    function getFriends(user){ const users=readUsers(); return users[user]?.friends||[]; }

    function readMessages(){ try{return JSON.parse(localStorage.getItem(MESSAGES_KEY))||{}}catch{return{}} }
    function writeMessages(m){ localStorage.setItem(MESSAGES_KEY,JSON.stringify(m)); }

    // ---- App ----
    function MomentsApp(){
      const [user,setUser]=useState(currentSession());
      const [view,setView]=useState("timelines");
      const [timelines,setTimelines]=useState(readTimelines());
      const [messages,setMessages]=useState(readMessages());

      function handleCreateTimeline(name,iconFile){
        let iconUrl=null;
        if(iconFile) {
          const reader=new FileReader();
          reader.onload=()=> {
            const newT={id:uid(),name,owner:user.username,posts:[],locked:false,icon:reader.result};
            const updated={...timelines,[newT.id]:newT};
            setTimelines(updated); writeTimelines(updated);
          }
          reader.readAsDataURL(iconFile);
        } else {
          const newT={id:uid(),name,owner:user.username,posts:[],locked:false,icon:null};
          const updated={...timelines,[newT.id]:newT};
          setTimelines(updated); writeTimelines(updated);
        }
      }

      function handleAddPost(tid,content,type){
        const t={...timelines[tid]};
        t.posts.push({id:uid(),owner:user.username,type,content,created:Date.now()});
        const updated={...timelines,[tid]:t};
        setTimelines(updated); writeTimelines(updated);
      }

      function toggleLock(tid){
        const t={...timelines[tid]};
        t.locked=!t.locked;
        const updated={...timelines,[tid]:t};
        setTimelines(updated); writeTimelines(updated);
      }

      function sendMessage(to,text){
        const m={...messages};
        if(!m[to]) m[to]=[];
        m[to].push({from:user.username,to,text,time:Date.now()});
        setMessages(m); writeMessages(m);
      }

      // ---- Components ----
      function AuthPanel(){
        const [mode,setMode]=useState("signin");
        const [u,setU]=useState(""),[p,setP]=useState(""),[err,setErr]=useState("");
        async function submit(e){ e.preventDefault();
          try{
            if(mode==="signup") await createAccount(u,p);
            await signIn(u,p);
            setUser(currentSession());
          }catch(e){setErr(e.message);}
        }
        return(
          <div className="p-6 bg-white rounded-xl shadow max-w-md mx-auto mt-20">
            <h2 className="text-xl font-bold mb-3">{mode==="signin"?"Sign In":"Create Account"}</h2>
            <form onSubmit={submit} className="space-y-2">
              <input className="w-full p-2 border rounded" placeholder="username" value={u} onChange={e=>setU(e.target.value)} />
              <input className="w-full p-2 border rounded" placeholder="password" type="password" value={p} onChange={e=>setP(e.target.value)} />
              {err && <div className="text-red-600 text-sm">{err}</div>}
              <div className="flex gap-2">
                <button className="px-3 py-1 bg-slate-900 text-white rounded w-full" type="submit">{mode==="signin"?"Sign in":"Sign up"}</button>
              </div>
              <button type="button" onClick={()=>setMode(mode==="signin"?"signup":"signin")} className="w-full px-3 py-1 border rounded">
                {mode==="signin"?"Need an account? Sign up":"Have an account? Sign in"}
              </button>
            </form>
          </div>
        )
      }

      function Dashboard(){
        return(
          <div className="p-4 max-w-5xl mx-auto">
            <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-6 gap-3">
              <h1 className="text-2xl font-bold">Moments</h1>
              <div className="flex gap-3 items-center">
                <div>Hello, <b>{user.username}</b></div>
                <button onClick={()=>{signOut();setUser(null)}} className="px-2 py-1 border rounded">Sign out</button>
              </div>
            </div>
            <div className="flex sm:gap-6 flex-col sm:flex-row">
              <div className="flex sm:flex-col gap-2 sm:w-40 w-full mb-4 sm:mb-0">
                <button onClick={()=>setView("timelines")} className={`px-3 py-2 rounded ${view==="timelines"?"bg-slate-900 text-white":"border"}`}>Timelines</button>
                <button onClick={()=>setView("family")} className={`px-3 py-2 rounded ${view==="family"?"bg-slate-900 text-white":"border"}`}>Family</button>
              </div>
              <div className="flex-1">
                {view==="timelines" && <Timelines />}
                {view==="family" && <Family />}
              </div>
            </div>
          </div>
        )
      }

      function Timelines(){
        const [name,setName]=useState("");
        const [iconFile,setIconFile]=useState(null);
        const myT=Object.values(timelines).filter(t=>t.owner===user.username);
        return(
          <div>
            <h2 className="text-xl font-semibold mb-4">Your Timelines</h2>
            <div className="flex flex-col sm:flex-row gap-2 mb-4">
              <input className="flex-1 p-2 border rounded" placeholder="New timeline name" value={name} onChange={e=>setName(e.target.value)} />
              <input type="file" accept="image/*" onChange={e=>setIconFile(e.target.files[0])} className="text-sm" />
              <button onClick={()=>{if(name){handleCreateTimeline(name,iconFile);setName("");setIconFile(null);}}} className="px-3 py-1 bg-slate-900 text-white rounded">Create</button>
            </div>
            <div className="grid gap-4">
              {myT.map(t=><Timeline key={t.id} timeline={t} isOwner />)}
            </div>
          </div>
        )
      }

      function Timeline({timeline,isOwner}){
        const [text,setText]=useState("");
        const [file,setFile]=useState(null);

        function addPost(type,content){
          handleAddPost(timeline.id,content,type);
          setText("");setFile(null);
        }

        return(
          <div className="bg-white p-4 rounded-xl shadow">
            <div className="flex justify-between items-center mb-2">
              <div className="flex items-center gap-2">
                {timeline.icon && <img src={timeline.icon} alt="" className="w-6 h-6 rounded-full" />}
                <h3 className="font-bold">{timeline.name}</h3>
              </div>
              {isOwner && (
                <button onClick={()=>toggleLock(timeline.id)} className="text-sm px-2 py-1 border rounded">
                  {timeline.locked?"🔒":"🔓"}
                </button>
              )}
            </div>
            {isOwner && (
              <form onSubmit={e=>{e.preventDefault(); if(text) addPost("text",text);}} className="mb-3">
                <textarea className="w-full border p-2 rounded mb-2" placeholder="Write something..." value={text} onChange={e=>setText(e.target.value)} />
                <div className="flex gap-2 flex-wrap">
                  <button type="submit" className="px-3 py-1 bg-slate-900 text-white rounded">Add Text</button>
                  <input type="file" onChange={e=>setFile(e.target.files[0])} />
                  <button type="button" onClick={()=>file && addPost("file",{name:file.name,type:file.type,url:URL.createObjectURL(file)})} className="px-3 py-1 border rounded">Upload</button>
                </div>
              </form>
            )}
            <div className="flex overflow-x-auto gap-3 pb-2">
              {timeline.posts.map(p=><PostCard key={p.id} p={p} />)}
            </div>
          </div>
        )
      }

      function PostCard({p}){
        return(
          <div className="border rounded p-2 min-w-[200px] max-w-[200px] flex-shrink-0">
            <div className="text-xs text-slate-500 mb-1">{p.owner} • {new Date(p.created).toLocaleString()}</div>
            {p.type==="text" && <div>{p.content}</div>}
            {p.type==="file" && (
              p.content.type.startsWith("image") ?
                <img src={p.content.url} alt="" className="w-full h-32 object-cover"/> :
                <video src={p.content.url} controls className="w-full h-32" />
            )}
          </div>
        )
      }

      function Family(){
        const users=readUsers();
        const myFriends=getFriends(user.username);
        const others=Object.keys(users).filter(u=>u!==user.username);

        function add(u){ addFriend(user.username,u); alert(`Added ${u} to family`); }

        return(
          <div>
            <h2 className="text-xl font-semibold mb-4">Family</h2>
            <h3 className="font-bold mb-2">Other Accounts</h3>
            <ul className="space-y-2 mb-6">
              {others.map(u=><li key={u} className="bg-white p-3 rounded shadow flex justify-between">
                <span>{u}</span>
                <button onClick={()=>add(u)} className="px-2 py-1 border rounded">Add Family</button>
              </li>)}
            </ul>
            <h3 className="font-bold mb-2">Your Family</h3>
            {myFriends.map(f=><FamilyMember key={f} friend={f} />)}
          </div>
        )
      }

      function FamilyMember({friend}){
        const friendTimelines=Object.values(readTimelines()).filter(t=>t.owner===friend && !t.locked);
        const [msg,setMsg]=useState("");
        const myMsgs=readMessages()[friend]||[];

        return(
          <div className="mb-6">
            <h4 className="font-semibold mb-2">{friend}'s Timelines</h4>
            {friendTimelines.length===0 && <div className="text-slate-500 mb-4">No visible timelines.</div>}
            {friendTimelines.map(tl=><Timeline key={tl.id} timeline={tl} isOwner={false} />)}

            <h4 className="font-semibold mt-4 mb-2">Chat with {friend}</h4>
            <div className="bg-white rounded shadow p-2 max-h-60 overflow-y-auto mb-2">
              {myMsgs.map((m,i)=>(
                <div key={i} className={`mb-1 ${m.from===friend?"text-left":"text-right"}`}>
                  <span className="inline-block px-2 py-1 rounded text-sm bg-slate-200">{m.from}: {m.text}</span>
                </div>
              ))}
            </div>
            <form onSubmit={e=>{e.preventDefault(); if(msg){sendMessage(friend,msg); setMsg("");}}} className="flex gap-2">
              <input className="flex-1 border rounded p-2" placeholder="Type a message..." value={msg} onChange={e=>setMsg(e.target.value)} />
              <button className="px-3 py-1 bg-slate-900 text-white rounded">Send</button>
            </form>
          </div>
        )
      }

      return user?<Dashboard />:<AuthPanel />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<MomentsApp />);
  </script>
</body>
</html>
